function Icon({ name, size = 22, color = C.forest, stroke = 2 }) {
  const p = { fill: "none", stroke: color, strokeWidth: stroke, strokeLinecap: "round", strokeLinejoin: "round" };
  const paths = {
    bulb: <><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10c.7.7 1 1.3 1 2h6c0-.7.3-1.3 1-2a6 6 0 0 0-4-10Z" {...p} /></>,
    home: <><path d="M4 11l8-6 8 6M6 10v9h12v-9" {...p} /></>,
    chart: <><path d="M5 20V9M12 20V4M19 20v-7" {...p} /></>,
    receipt: <><path d="M6 3h12v18l-3-2-3 2-3-2-3 2Z M9 8h6M9 12h6" {...p} /></>,
    users: <><circle cx="9" cy="8" r="3" {...p} /><path d="M4 20a5 5 0 0 1 10 0M16 6a3 3 0 0 1 0 6M15 20a5 5 0 0 0-1-3" {...p} /></>,
    bag: <><path d="M6 8h12l-1 12H7L6 8Z M9 8V6a3 3 0 0 1 6 0v2" {...p} /></>,
    shield: <><path d="M12 3l7 3v5c0 4-3 7-7 8-4-1-7-4-7-8V6l7-3Z" {...p} /><path d="M9 12l2 2 4-4" {...p} /></>,
    journey: <><path d="M6 20c4 0 5-9 11-13" {...p} stroke={color} /><circle cx="18" cy="6" r="1.6" fill={color} stroke="none" /></>,
    launchNav: <><path d="M5 11l7-6 7 6M7 10v9h10v-9" {...p} /></>,
    grid: <><rect x="4" y="4" width="7" height="7" rx="1.5" {...p} /><rect x="13" y="4" width="7" height="7" rx="1.5" {...p} /><rect x="4" y="13" width="7" height="7" rx="1.5" {...p} /><rect x="13" y="13" width="7" height="7" rx="1.5" {...p} /></>,
    profile: <><circle cx="12" cy="8" r="3.5" {...p} /><path d="M5 20a7 7 0 0 1 14 0" {...p} /></>,
    check: <><path d="M5 12l4 4 10-10" {...p} stroke="#fff" strokeWidth="2.4" /></>,
    bang: <><path d="M12 7v6M12 16v.5" {...p} stroke={C.goldText} /></>,
  };
  return <svg width={size} height={size} viewBox="0 0 24 24">{paths[name]}</svg>;
}

function Logo({ light }) {
  return (
    <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
      <path d="M7 24 C 12 24, 13 11, 25 8" stroke={C.gold} strokeWidth="2.6" strokeLinecap="round" fill="none" />
      <circle cx="24" cy="8" r="2.4" fill={light ? "#fff" : C.forest} />
    </svg>

  return <span style={{ ...styles, fontSize: 12.5, fontWeight: 700, padding: "5px 12px", borderRadius: 20, whiteSpace: "nowrap" }}>{text}</span>;

function App() {
  const [lang, setLang] = useState("en");
  const [screen, setScreen] = useState("onboarding");
  const t = T[lang];

  // which bottom tab is active for a given screen
  const tabForScreen = {
    journey: "journey", ideate: "journey", mapper: "journey",
    launch: "launch", market: "launch", connect: "launch",
    operate: "operate", invoice: "operate",
    profile: "profile",
  };
  const backMap = {
    ideate: "journey", mapper: "ideate", market: "launch", connect: "launch", invoice: "operate",
    pricing: "journey",
  };

  const go = (s) => setScreen(s);
  const tab = tabForScreen[screen] || "journey";
  const hdr = {
    journey: null, ideate: t.ideateHdr, mapper: t.mapperHdr, launch: t.launchHdr,
    market: t.marketHdr, connect: t.connectHdr, operate: t.opHdr, invoice: t.invHdr,
    profile: t.tabs.profile, pricing: t.prHdr,
  };
  const showBack = ["ideate", "mapper", "market", "connect", "invoice", "pricing"].includes(screen);

  const body = () => {
    switch (screen) {
      case "onboarding": return <Onboarding t={t} lang={lang} setLang={setLang} go={go} />;
      case "journey": return <Journey t={t} go={go} />;
      case "ideate": return <Ideate t={t} go={go} />;
      case "mapper": return <Mapper t={t} />;
      case "launch": return <Launch t={t} go={go} />;
      case "market": return <Market t={t} />;
      case "connect": return <Connect t={t} />;
      case "operate": return <Operate t={t} go={go} />;
      case "invoice": return <Invoice t={t} />;
      case "profile": return <Profile t={t} lang={lang} />;
      case "pricing": return <Pricing t={t} />;
      default: return null;
    }
  };

  return (
    <div className="intilaqa-stage" style={{ background: "#E8ECE6" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap');
        .intilaqa-stage{
          min-height:100vh; min-height:100dvh;
          display:flex; flex-direction:column; align-items:center;
          padding:24px 14px; gap:14px;
        }
        .intilaqa-phone{
          width:380px; max-width:100%;
          height:800px; max-height:calc(100dvh - 120px);
          border-radius:44px; border:11px solid #12201B;
          flex-shrink:0;
          overflow:hidden;
        }
        /* clean, thin scrollbars inside the phone */
        .intilaqa-phone *::-webkit-scrollbar{ width:0px; height:0px; }
        .intilaqa-phone *{ scrollbar-width:none; -ms-overflow-style:none; }
        /* On real phones: fill the screen, hide the demo chrome */
        @media (max-width:640px){
          .intilaqa-stage{ padding:0; gap:0; background:#12201B; }
          .intilaqa-phone{
            width:100%; height:100dvh; max-height:100dvh;
            border-radius:0; border:0;
          }
          .intilaqa-pills{ display:none !important; }
        }
      `}</style>

      <Phone dir={t.dir} dark={screen === "onboarding"}>
        <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
          {screen === "onboarding"
            ? <Onboarding t={t} lang={lang} setLang={setLang} go={go} />
            : (
              <>
                <Header t={t} lang={lang} setLang={setLang} title={hdr[screen] ?? ""} onBack={showBack ? () => go(backMap[screen] || "journey") : null} />
                <Scroll>{body()}</Scroll>
                <TabBar t={t} tab={tab} setTab={setScreen} go={go} />
              </>
            )}
        </div>
      </Phone>

      {/* demo jump pills */}
      <div className="intilaqa-pills" style={{ display: "flex", gap: 6, flexWrap: "wrap", justifyContent: "center", maxWidth: 430, marginTop: 4 }}>
        {[
          ["onboarding", lang === "ar" ? "البداية" : "Start"],
          ["journey", t.tabs.journey],
          ["ideate", lang === "ar" ? "التحقق" : "Validate"],
          ["mapper", lang === "ar" ? "المُخطِّط" : "Mapper"],
          ["launch", t.tabs.launch],
          ["market", lang === "ar" ? "السوق" : "Market"],
          ["connect", "Connect"],
          ["operate", t.tabs.operate],
          ["invoice", lang === "ar" ? "الفوترة" : "Invoice"],
          ["pricing", lang === "ar" ? "الأسعار" : "Pricing"],
          ["profile", t.tabs.profile],
        ].map(([k, label]) => (
          <button key={k} onClick={() => setScreen(k)}
            style={{ background: screen === k ? C.forest : "#fff", color: screen === k ? "#fff" : C.mute,
              border: `1px solid ${screen === k ? C.forest : C.line}`, borderRadius: 20, padding: "7px 12px", fontSize: 11.5, fontWeight: 600, cursor: "pointer" }}>
            {label}
          </button>
        ))}
      </div>
    </div>
  );
}


  const le=document.getElementById("loading"); if(le) le.style.display="none";
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch(e){ window.__err(e && e.stack ? e.stack : String(e)); }
</script>
<script>
  setTimeout(function(){var r=document.getElementById('root');if(r&&r.children.length===0){var l=document.getElementById('loading');if(l&&l.style.display!=='none')window.__err('Scripts did not finish loading (CDN may be blocked).');}},6000);
</script>
</body>
</html>
