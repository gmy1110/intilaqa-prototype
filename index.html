  const arch = light ? "#fff" : C.forest;
  return (
    <svg width={size} height={size} viewBox="0 0 32 32" fill="none">

      <path d="M8.5 26 h2 M21.5 26 h2 M9.5 26 V15 a6.5 6.5 0 0 1 13 0 V26"

        stroke={C.gold} strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round" fill="none" />

}

function Phone({ children, dir, dark, w, h, s, mobile }) {
  const bw = mobile ? 0 : 12;
  return (
    <div style={{ width: (w + bw * 2) * s, height: (h + bw * 2) * s, position: "relative", flexShrink: 0 }}>
      <div className="intilaqa-phone" style={{ width: w, height: h, background: dark ? C.forest : C.paper,
        boxShadow: mobile ? "none" : "0 30px 70px rgba(20,40,30,.30)", overflow: "hidden", position: "absolute", top: 0, left: 0,
        transform: `scale(${s})`, transformOrigin: "top left",
        direction: dir, fontFamily: dir === "rtl" ? "'Noto Kufi Arabic', system-ui, sans-serif" : "'Poppins','Segoe UI',system-ui,sans-serif" }}>
        {children}
      </div>
    </div>
  );
}

// ---------- Scoring engine (deterministic, rubric-aligned) ----------
// Lenses: Desirability 40% / Feasibility 35% / Viability 25%.
// answers = { [questionKey]: optionIndex }. Returns full result object.
const LENS_W = { desirability: 0.40, feasibility: 0.35, viability: 0.25 };

function scoreQuiz(t, answers) {
  const qs = t.quizQs;
  const buckets = { desirability: [], feasibility: [], viability: [] };
  let sector = null;

  qs.forEach((q) => {
    const ai = answers[q.key];
    if (ai == null) return;
    const opt = q.opts[ai];
    if (q.type === "select") { sector = opt; return; } // sector sets context, not points
    buckets[q.lens].push(opt.pts); // each scored option is out of 20
  });

  // per-lens 0..100 = mean of its answered questions, scaled from /20
  const lensPct = {};
  ["desirability", "feasibility", "viability"].forEach((L) => {
    const arr = buckets[L];
    lensPct[L] = arr.length ? Math.round((arr.reduce((a, b) => a + b, 0) / arr.length) * 5) : 0;
  });

  const overall = Math.round(
    lensPct.desirability * LENS_W.desirability +
    lensPct.feasibility * LENS_W.feasibility +
    lensPct.viability * LENS_W.viability
  );

  const weakest = ["desirability", "feasibility", "viability"]
    .reduce((w, L) => (lensPct[L] < lensPct[w] ? L : w), "desirability");

  const verdictKey = overall >= 75 ? "strong" : overall >= 55 ? "promising" : overall >= 40 ? "needswork" : "tooearly";

  // ---- Saudi market insight, derived from sector + license + competition ----
  const lines = [];
  if (sector) {
    const p = sector.priority;
    if (p === "High") lines.push(t.insight.priHigh(sector.label));
    else if (p === "Medium") lines.push(t.insight.priMed(sector.label));
    else lines.push(t.insight.priLow);
  }
  const licAns = answers.license;
  if (licAns != null) {
    if (licAns === 0) lines.push(t.insight.regNone);
    else if (licAns === 3) { // "I don't know"
      const reg = sector && t.regulators[sector.label];
      lines.push(reg ? t.insight.regKnown(reg) : t.insight.regUnknown);
    } else {
      const reg = sector && t.regulators[sector.label];
      lines.push(reg ? t.insight.regKnown(reg) : t.insight.regUnknown);
    }
  }
  const compAns = answers.competition;
  if (compAns === 1) lines.push(t.insight.compGap);        // foreign apps not localised
  else if (compAns === 2) lines.push(t.insight.compNew);   // nobody
  else if (compAns === 3) lines.push(t.insight.compRival); // established local

  return {
    overall,
    lens: lensPct,
    weakest,
    verdict: t.verdicts[verdictKey],
    verdictKey,
    sector,
    insight: lines.slice(0, 3),
    nextStep: t.nextSteps[weakest],
  };
}

// ---------- Quiz ----------
function Quiz({ t, lang, go, S }) {
  const idx = S.quizIdx;
  const total = t.quizQs.length;
  const q = t.quizQs[idx];
  const isSelect = q.type === "select";
  const pick = (i) => {
    const next = { ...S.answers, [q.key]: i };
    S.setAnswers(next);
    if (idx + 1 >= total) {
      S.setResult(scoreQuiz(t, next));
      S.setQuizDone(true);
      S.setQuizIdx(0);
      go("scoreReveal");
    } else {
      S.setQuizIdx(idx + 1);
    }
  };
  const cur = S.answers[q.key];
  return (
    <>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <span style={{ fontSize: 15, fontWeight: 700, color: C.pine }}>{num(idx + 1, lang)} {t.qOf} {num(total, lang)}</span>
      </div>
      <div style={{ height: 8, background: C.lineSoft, borderRadius: 5, overflow: "hidden", marginBottom: 26 }}>
        <div style={{ width: `${((idx) / total) * 100}%`, height: "100%", background: C.gold, borderRadius: 5, transition: "width .3s" }} />
      </div>
      <h1 style={{ fontSize: 25, fontWeight: 700, color: C.ink, margin: "0 0 22px", lineHeight: 1.25 }}>{q.q}</h1>
      {isSelect && <div style={{ fontSize: 13.5, color: C.mute, marginBottom: 12, marginTop: -10 }}>{t.quizPick}</div>}
      <div style={isSelect ? { maxHeight: 560, overflowY: "auto", margin: "0 -4px", padding: "0 4px" } : null}>
        {q.opts.map((o, i) => {
          const label = isSelect ? o.label : o.label;
          const sel = cur === i;
          return (
            <button key={i} onClick={() => pick(i)}
              style={{ width: "100%", textAlign: t.dir === "rtl" ? "right" : "left",
                background: sel ? C.sageLt : C.card, border: `1.5px solid ${sel ? C.forest : "transparent"}`,
                borderRadius: isSelect ? 14 : 18, padding: isSelect ? "15px 18px" : "18px 20px",
                marginBottom: isSelect ? 9 : 12, cursor: "pointer", fontSize: isSelect ? 15.5 : 16.5,
                fontWeight: 600, color: C.ink, boxShadow: "0 4px 14px rgba(30,50,40,.05)" }}>
              {label}
            </button>
          );
        })}
      </div>
    </>
  );
}

// ---------- Score reveal ----------
function ScoreReveal({ t, lang, go, S }) {
  const target = (S.result && S.result.overall) || 0;
  const [n, setN] = React.useState(0);
  React.useEffect(() => {
    let v = 0;
    const iv = setInterval(() => { v += 2; if (v >= target) { v = target; clearInterval(iv); } setN(v); }, 28);
    return () => clearInterval(iv);
  }, [target]);
  const r = 62, circ = 2 * Math.PI * r;
  const done = n >= target;
  const vd = (S.result && S.result.verdict) || t.verdicts.promising;
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", paddingTop: 40 }}>
      <div style={{ color: C.mute, fontSize: 16, marginBottom: 26 }}>{done ? "" : t.revealTitle}</div>
      <div style={{ position: "relative", width: 170, height: 170 }}>
        <svg width="170" height="170" viewBox="0 0 150 150">
          <circle cx="75" cy="75" r={r} fill="none" stroke={C.lineSoft} strokeWidth="11" />
          <circle cx="75" cy="75" r={r} fill="none" stroke={C.gold} strokeWidth="11" strokeLinecap="round"
            strokeDasharray={circ} strokeDashoffset={circ * (1 - n / 100)} transform="rotate(-90 75 75)" />
        </svg>
        <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
          <span style={{ fontSize: 48, fontWeight: 700, color: C.ink, lineHeight: 1 }}>{num(n, lang)}</span>
          <span style={{ fontSize: 13, color: C.mute, marginTop: 4 }}>{t.scoreOf}</span>
        </div>
      </div>
      {done && (
        <>
          <div style={{ color: C.gold, fontWeight: 700, fontSize: 14, letterSpacing: 1, marginTop: 26 }}>{vd.tag}</div>
          <div style={{ color: C.ink, fontSize: 22, fontWeight: 700, marginTop: 8, textAlign: "center" }}>{vd.line1}</div>
          <div style={{ width: "100%", marginTop: 30 }}>
            <Primary onClick={() => go("ideate")}>{t.seeResults}</Primary>
          </div>
        </>
      )}
    </div>
  );
}

// ---------- Ideate results ----------
function Ideate({ t, lang, go, S }) {
  // fall back to a sensible demo result if quiz wasn't taken this session
  const res = S.result || scoreQuiz(t, { sector: 3, impact: 0, payer: 0, license: 3, founder: 0, evidence: 1, competition: 1, money: 1, stage: 2 });
  const val = res.overall, r = 52, circ = 2 * Math.PI * r;
  const lensOrder = ["desirability", "feasibility", "viability"];
  return (

// ---------- Launch (interactive tracker + personalization) ----------
// Foreign founders: full 5-step path, MISA first. Saudi/GCC: MISA marked not-required.
function isForeign(S) {
  // Fahad demo = foreign. Otherwise read the quiz's founder answer (0 Saudi,1 GCC,2 resident,3 abroad).
  if (S.persona === "fahad") return true;
  const f = S.answers && S.answers.founder;
  if (f == null) return true;        // fallback: full path
  return f >= 2;                     // resident / abroad = foreign
}

function Launch({ t, lang, go, S }) {
  const foreign = isForeign(S);
  const steps = t.steps;
  // Saudi/GCC skip MISA: treat it as auto-satisfied and not counted.
  const active = steps.map((s, i) => (i === 0 && !foreign ? false : true)); // is step part of the path
  const isDone = (i) => S.launchSteps[steps[i].key];
  const doneCount = steps.filter((s, i) => active[i] && isDone(i)).length;
  const totalCount = active.filter(Boolean).length;
  const remainingDays = steps.reduce((sum, s, i) => (active[i] && !isDone(i) ? sum + s.days : sum), 0);
  const allDone = doneCount === totalCount;
  // first not-done active step = current
  const curIdx = steps.findIndex((s, i) => active[i] && !isDone(i));

  return (
    <>
      <div style={{ background: C.sageLt, borderRadius: 16, padding: "13px 16px", marginBottom: 18, display: "flex", gap: 11, alignItems: "flex-start" }}>
        <Icon name="shield" size={18} color={C.pine} />
        <span style={{ fontSize: 13.5, color: C.pine, lineHeight: 1.4 }}>{t.launchFramer}</span>
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 12 }}>
        <span style={{ fontSize: 27, fontWeight: 700, color: C.ink }}>{num(doneCount, lang)} {t.portalsOf}</span>
        <span style={{ fontSize: 15, fontWeight: 600, color: allDone ? C.pine : C.mute }}>{allDone ? t.complete : t.daysEst(remainingDays)}</span>
      </div>
      <div style={{ height: 10, background: C.lineSoft, borderRadius: 6, overflow: "hidden", marginBottom: 5 }}>
        <div style={{ width: `${(doneCount / totalCount) * 100}%`, height: "100%", background: C.forest, borderRadius: 6, transition: "width .4s" }} />
      </div>
      {!allDone && <div style={{ fontSize: 12, color: C.mute, marginBottom: 20, textAlign: t.dir === "rtl" ? "right" : "left" }}>{t.daysCalc}</div>}
      {allDone && <div style={{ marginBottom: 20 }} />}

      {steps.map((s, i) => {
        const inactive = !active[i];       // MISA for Saudi/GCC
        const done = active[i] && isDone(i);
        const cur = i === curIdx;
        return (
          <button key={i} onClick={() => { if (!inactive) { S.setLaunchStep(i); go("walkthrough"); } }}
            disabled={inactive}
            style={{ width: "100%", textAlign: t.dir === "rtl" ? "right" : "left", display: "block",
              background: inactive ? "rgba(255,255,255,.4)" : (!done && !cur ? "rgba(255,255,255,.6)" : C.card),
              border: `1.5px solid ${cur ? C.forest : "transparent"}`, borderRadius: 22, padding: 18, marginBottom: 13,
              boxShadow: inactive || (!done && !cur) ? "none" : "0 6px 18px rgba(30,50,40,.05)", cursor: inactive ? "default" : "pointer", opacity: inactive ? .75 : 1 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 15 }}>
              <div style={{ width: 36, height: 36, borderRadius: "50%", flexShrink: 0, display: "grid", placeItems: "center",
                background: done ? C.forest : "transparent", border: done ? "none" : cur ? `2.5px solid ${C.forest}` : `2px solid ${C.line}` }}>
                {done && <Icon name="check" size={17} />}
                {cur && <div style={{ width: 12, height: 12, borderRadius: "50%", background: C.forest }} />}
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 17.5, fontWeight: 700, color: inactive || (!done && !cur) ? C.mute : C.ink }}>{s.portal}</div>
                <div style={{ fontSize: 14, color: C.mute, marginTop: 2 }}>{inactive ? t.gccSkip : (done && s.subDone ? s.subDone : s.sub)}</div>
              </div>
              {!inactive && (
                <span style={{ fontSize: 14.5, fontWeight: 700, color: done ? C.pine : cur ? "#fff" : C.mute,
                  background: cur ? C.forest : "transparent", padding: cur ? "6px 14px" : 0, borderRadius: 20 }}>
                  {done ? t.stDone : cur ? t.stCurrent : t.stUpcoming}
                </span>
              )}
              {!inactive && <span style={{ color: C.mute, fontSize: 20, marginLeft: t.dir === "rtl" ? 0 : 4, marginRight: t.dir === "rtl" ? 4 : 0 }}>{t.dir === "rtl" ? "‹" : "›"}</span>}
            </div>
          </button>
        );
      })}

      <div style={{ background: C.card, border: `1.5px dashed ${C.sage}`, borderRadius: 20, padding: 16, marginTop: 7, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
        <span style={{ fontSize: 15, fontWeight: 600, color: C.ink }}>{t.needPro}</span>
        <button onClick={() => go("market")} style={{ background: C.sageLt, color: C.pine, border: "none", borderRadius: 12, padding: "10px 15px", fontSize: 14, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap" }}>{t.openMarket}</button>
      </div>
      <button onClick={() => go("connect")} style={{ width: "100%", background: C.sageLt, color: C.pine, border: "none", borderRadius: 16, padding: 16, fontSize: 15.5, fontWeight: 700, cursor: "pointer", marginTop: 13 }}>{t.seeConnect}</button>
    </>
  );
}

// ---------- Walkthrough (portal detail) ----------
function Walkthrough({ t, lang, go, S }) {
  const i = S.launchStep;
  if (i == null) { go("launch"); return null; }
  const s = t.steps[i];
  const done = S.launchSteps[s.key];
  const foreign = isForeign(S);
  const markDone = () => {
    S.setLaunchSteps({ ...S.launchSteps, [s.key]: true });
    if (s.key === "zatca") S.setZatcaDone(true); // keep other screens in sync
    go("launch");
  };
  const Sec = ({ title, children }) => (
    <div style={{ marginBottom: 18 }}>
      <div style={{ fontSize: 13, fontWeight: 700, color: C.goldText, letterSpacing: .5, marginBottom: 9 }}>{title}</div>
      {children}
    </div>
  );
  const list = (arr, ordered) => arr.map((x, j) => (
    <div key={j} style={{ display: "flex", gap: 11, marginBottom: 9, alignItems: "flex-start" }}>
      <span style={{ flexShrink: 0, fontWeight: 700, color: C.pine, fontSize: 14.5, minWidth: ordered ? 18 : "auto" }}>{ordered ? num(j + 1, lang) + "." : "•"}</span>
      <span style={{ fontSize: 14.5, color: C.ink, lineHeight: 1.4 }}>{x}</span>
    </div>
  ));
  return (
    <>
      <div style={{ fontSize: 15, color: C.ink, lineHeight: 1.5, marginBottom: 18 }}>{s.wWhat}</div>
      {i === 0 && foreign && (
        <div style={{ background: C.goldSoft, borderRadius: 16, padding: "13px 16px", marginBottom: 18, fontSize: 13.5, color: C.ink, lineHeight: 1.4 }}>{t.foreignNote}</div>
      )}
      <Sec title={t.wPrepT}>{list(s.wPrep, false)}</Sec>
      <Sec title={t.wStepsT}>{list(s.wSteps, true)}</Sec>
      <Sec title={t.wTimeT}><div style={{ fontSize: 14.5, color: C.ink }}>{s.wTime}</div></Sec>

      <a href={s.url} target="_blank" rel="noopener noreferrer"
        style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, width: "100%", background: C.forest, color: "#fff", borderRadius: 16, padding: 16, fontSize: 16, fontWeight: 700, textDecoration: "none", marginBottom: 12, boxSizing: "border-box" }}>
        {t.wOpen} {t.dir === "rtl" ? "←" : "→"}
      </a>
      <button onClick={markDone} disabled={done}
        style={{ width: "100%", background: done ? C.sageLt : "#fff", color: done ? C.pine : C.forest, border: `1.5px solid ${C.forest}`, borderRadius: 16, padding: 15, fontSize: 15.5, fontWeight: 700, cursor: done ? "default" : "pointer" }}>
        {done ? t.wMarkedDone : t.wMarkDone}
      </button>
    </>
  );
}

// ---------- Our Partners (ratings + tracked referral) ----------
function Stars({ rating }) {
  const full = Math.round(rating);
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 5 }}>
      <span style={{ letterSpacing: 1, color: C.gold, fontSize: 14 }}>{"★".repeat(full)}<span style={{ color: C.line }}>{"★".repeat(5 - full)}</span></span>
      <span style={{ fontSize: 13, fontWeight: 700, color: C.ink }}>{rating.toFixed(1)}</span>
    </span>
  );
}

function Market({ t, S }) {
  const advance = (i) => {
    const cur = S.referrals[i];
    const next = cur == null ? 0 : Math.min(cur + 1, t.refStages.length - 1);
    S.setReferrals({ ...S.referrals, [i]: next });
  };
  return (
    <>
      <p style={{ color: C.mute, fontSize: 14.5, margin: "0 0 16px", lineHeight: 1.45 }}>{t.marketSub}</p>
      {t.partners.map((p, i) => {
        const stage = S.referrals[i]; // undefined until submitted
        const submitted = stage != null;
        return (
          <div key={i} style={{ background: C.card, borderRadius: 22, padding: 19, marginBottom: 14, boxShadow: "0 6px 18px rgba(30,50,40,.05)" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 18, fontWeight: 700, color: C.ink }}>{p.name}</div>
                <div style={{ fontSize: 14, color: C.mute, marginTop: 2 }}>{p.type}</div>
              </div>
              <span style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 12.5, fontWeight: 700, color: C.pine, background: C.sageLt, padding: "5px 11px", borderRadius: 20, whiteSpace: "nowrap" }}>
                <Icon name="check" size={13} color="#fff" /> {t.vetted}</span>
            </div>
            <div style={{ margin: "12px 0" }}>
              <Stars rating={p.rating} />
            </div>
            <div style={{ fontSize: 13.5, color: C.mute, lineHeight: 1.4, marginBottom: 14 }}>{p.note}</div>

            {submitted ? (
              <>
                <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 10 }}>
                  {t.refStages.map((st, j) => (
                    <div key={j} style={{ flex: 1, height: 6, borderRadius: 4, background: j <= stage ? C.forest : C.lineSoft }} />
                  ))}
                </div>
                <button onClick={() => advance(i)} disabled={stage >= t.refStages.length - 1}
                  style={{ width: "100%", background: C.sageLt, color: C.pine, border: "none", borderRadius: 14, padding: 13, fontSize: 14.5, fontWeight: 700, cursor: stage >= t.refStages.length - 1 ? "default" : "pointer" }}>
                  {t.refStages[stage]}
                </button>
                <div style={{ fontSize: 11.5, color: C.mute, textAlign: "center", marginTop: 8, opacity: .8 }}>{t.refFeedNote}</div>
              </>
            ) : (
              <button onClick={() => advance(i)}
                style={{ width: "100%", background: C.forest, color: "#fff", border: "none", borderRadius: 14, padding: 14, fontSize: 15, fontWeight: 700, cursor: "pointer" }}>
                {t.submitReq}
              </button>
            )}
          </div>
        );
      })}
    </>
  );
}

// pipeline stage chip color: -1 overdue (gold), else sage progression
function stageChip(stage, t) {
  if (stage === -1) return { label: t.pipeOverdue, bg: C.goldSoft, fg: C.goldText };
  const label = t.pipeStages[stage] || t.pipeStages[0];
  const paid = stage >= 3;
  return { label, bg: paid ? C.forest : C.sageLt, fg: paid ? "#fff" : C.pine };
}

// ---------- Customers (pipeline + import) ----------
function Customers({ t, lang, go, S }) {
  const rows = S.crm || t.custRows;
  const setRows = (r) => S.setCrm(r);
  const advance = (i) => {
    const r = rows.map((x, j) => {
      if (j !== i) return x;
      const ns = x.stage === -1 ? 0 : Math.min(x.stage + 1, 3);
      return { ...x, stage: ns, stale: false };
    });
    setRows(r);
  };
  // pipeline counts
  const counts = t.pipeStages.map((_, si) => rows.filter(r => r.stage === si).length);
  const overdue = rows.filter(r => r.stage === -1).length;
  return (
    <>
      {/* pipeline summary */}
      <div style={{ background: C.card, borderRadius: 18, padding: "14px 16px", marginBottom: 14, boxShadow: "0 4px 14px rgba(30,50,40,.04)" }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: C.mute, marginBottom: 10, letterSpacing: .3 }}>{t.pipeSummary}</div>
        <div style={{ display: "flex", gap: 8 }}>
          {t.pipeStages.map((st, i) => (
            <div key={i} style={{ flex: 1, textAlign: "center" }}>
              <div style={{ fontSize: 20, fontWeight: 700, color: C.ink }}>{num(counts[i], lang)}</div>
              <div style={{ fontSize: 10.5, color: C.mute, marginTop: 2 }}>{st}</div>
            </div>
          ))}
          {overdue > 0 && (
            <div style={{ flex: 1, textAlign: "center" }}>
              <div style={{ fontSize: 20, fontWeight: 700, color: C.goldText }}>{num(overdue, lang)}</div>
              <div style={{ fontSize: 10.5, color: C.goldText, marginTop: 2 }}>{t.pipeOverdue}</div>
            </div>
          )}
        </div>
      </div>

      {/* import affordance */}
      <button onClick={() => { S.setImported(true); }}
        style={{ width: "100%", display: "flex", alignItems: "center", gap: 11, background: S.imported ? C.sageLt : C.card, borderRadius: 16, padding: "13px 16px", marginBottom: 16, boxShadow: "0 4px 14px rgba(30,50,40,.04)", border: "none", cursor: "pointer", textAlign: t.dir === "rtl" ? "right" : "left" }}>
        <Icon name={S.imported ? "check" : "download"} size={18} color={C.pine} />
        <div style={{ flex: 1 }}>

      <div style={{ fontSize: 11.5, color: C.mute, marginBottom: 10, textAlign: t.dir === "rtl" ? "right" : "left" }}>{t.advanceHint}</div>
      <div style={{ background: C.card, borderRadius: 22, padding: "6px 18px", boxShadow: "0 6px 18px rgba(30,50,40,.05)", marginBottom: 18 }}>
        {rows.map((r, i) => {

          const canInvoice = r.stage === 1; // quoted -> can create invoice
          return (
            <div key={i} style={{ padding: "15px 0", borderBottom: i < rows.length - 1 ? `1px solid ${C.lineSoft}` : "none" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 14 }}>

              )}

          <span style={{ fontSize: 50, fontWeight: 700, color: "#fff", lineHeight: 1 }}>{L.price}</span>
          <span style={{ fontSize: 19, color: "rgba(255,255,255,.6)" }}>{L.range}</span>
        </div>
        <div style={{ borderTop: "1px solid rgba(255,255,255,.15)", paddingTop: 18 }}>
          {L.feats.map((f, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 14 }}>
              <Icon name="check" size={17} color={C.gold} />
              <span style={{ fontSize: 16, color: "#fff" }}>{f}</span>
            </div>
          ))}
        </div>
        <button onClick={() => S.setTier(1)} style={{ width: "100%", background: S.tier === 1 ? C.gold : "#fff", color: C.forest, border: "none", borderRadius: 16, padding: 17, fontSize: 17, fontWeight: 700, cursor: "pointer", marginTop: 8, transition: "background .2s" }}>{S.tier === 1 ? t.selected : L.cta}</button>
      </div>
      <button onClick={() => S.setTier(2)} style={{ width: "100%", textAlign: t.dir === "rtl" ? "right" : "left", background: C.card, border: `1.5px solid ${S.tier === 2 ? C.forest : "transparent"}`, borderRadius: 22, padding: 20, marginBottom: 18, display: "flex", justifyContent: "space-between", alignItems: "center", boxShadow: "0 6px 18px rgba(30,50,40,.05)", cursor: "pointer" }}>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 20, fontWeight: 700, color: C.ink }}>{t.prOperate.name}</div>
          <div style={{ fontSize: 14, color: C.mute, marginTop: 3 }}>{t.prOperate.sub}</div>
        </div>
        <div style={{ textAlign: t.dir === "rtl" ? "left" : "right" }}>
          <div style={{ fontSize: 20, fontWeight: 700, color: C.ink }}>{S.tier === 2 ? t.selected : t.prOperate.price}</div>
          {S.tier !== 2 && <div style={{ fontSize: 13, color: C.mute }}>{t.prOperate.per}</div>}
        </div>
      </button>
      <div style={{ textAlign: "center", color: C.mute, fontSize: 14, opacity: .85 }}>{t.prFoot}</div>
    </>
  );
}

// ---------- Profile ----------
function Profile({ t, lang, go, S }) {
  const acct = t.demoAccounts.find(a => a.id === S.persona) || t.demoAccounts[2];
  const initial = acct.name.trim().charAt(0);
  return (
    <>
      <div style={{ display: "flex", alignItems: "center", gap: 17, marginBottom: 26 }}>
        <div style={{ width: 70, height: 70, borderRadius: 22, background: C.forest, display: "grid", placeItems: "center", color: C.gold, fontSize: 26, fontWeight: 700 }}>{initial}</div>
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
            <span style={{ fontSize: 22, fontWeight: 700, color: C.ink }}>{acct.name}</span>
            {(() => { const tp = tierPill(acct.tier); return (
              <span style={{ fontSize: 11, fontWeight: 700, color: tp.fg, background: tp.bg, padding: "3px 10px", borderRadius: 20 }}>{t.tierNames[acct.tier]}</span>
            ); })()}
          </div>
          <div style={{ fontSize: 15, color: C.mute, marginTop: 3 }}>{acct.email}</div>
        </div>
      </div>
      {t.profRows.map((it, i) => (
        <button key={i} onClick={() => { S.setProfileRow(i); go("profileDetail"); }}
          style={{ width: "100%", textAlign: t.dir === "rtl" ? "right" : "left", background: C.card, border: "none", borderRadius: 18, padding: 19, marginBottom: 12, display: "flex", justifyContent: "space-between", alignItems: "center", boxShadow: "0 4px 14px rgba(30,50,40,.04)", cursor: "pointer" }}>
          <span style={{ fontSize: 16.5, color: C.ink, fontWeight: 500 }}>{it}</span>
          <span style={{ color: C.mute, fontSize: 20 }}>{t.dir === "rtl" ? "‹" : "›"}</span>
        </button>
      ))}
      <button onClick={() => go("login")}
        style={{ width: "100%", background: "none", border: `1.5px solid ${C.line}`, borderRadius: 16, padding: 15, marginTop: 8, fontSize: 15.5, fontWeight: 700, color: C.goldText, cursor: "pointer" }}>
        {t.logout}
      </button>
    </>
  );
}

function ProfileDetail({ t, S }) {
  const fields = t.profDetails[S.profileRow] || [];
  return (
    <div style={{ background: C.card, borderRadius: 22, padding: "8px 20px", boxShadow: "0 6px 18px rgba(30,50,40,.05)" }}>
      {fields.map((f, i) => (
        <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "17px 0", borderBottom: i < fields.length - 1 ? `1px solid ${C.lineSoft}` : "none" }}>
          <span style={{ color: C.mute, fontSize: 15.5 }}>{f.k}</span>
          <span style={{ color: C.ink, fontSize: 15.5, fontWeight: 600 }}>{f.v}</span>
        </div>
      ))}
    </div>
  );
}

// ============================================================
function App() {
  const [lang, setLang] = useState("en");
  const [screen, setScreen] = useState("splash");
  const [splashIdx, setSplashIdx] = useState(0);
  const t = T[lang];

  // ---- session state ----
  const [persona, setPersona] = useState("fahad");
  const [quizDone, setQuizDone] = useState(false);
  const [quizIdx, setQuizIdx] = useState(0);
  const [answers, setAnswers] = useState({});
  const [result, setResult] = useState(null);
  const [zatcaDone, setZatcaDone] = useState(false);
  const [launchSteps, setLaunchSteps] = useState({ misa: true, moc: true, zatca: false, gosi: false, qiwa: false });
  const [launchStep, setLaunchStep] = useState(null); // which portal walkthrough is open
  const [referrals, setReferrals] = useState({});      // partnerIndex -> stage (0..3)
  const [invoices, setInvoices] = useState(12);
  const [quotes, setQuotes] = useState({});
  const [applied, setApplied] = useState({});
  const [vatFiled, setVatFiled] = useState(false);
  const [waitlist, setWaitlist] = useState(false);
  const [tier, setTier] = useState(null);
  const [profileRow, setProfileRow] = useState(0);
  const [crm, setCrm] = useState(null);          // pipeline rows (init from t on first Operate render)
  const [orders, setOrders] = useState(null);    // job rows
  const [imported, setImported] = useState(false);
  const [alertReviewed, setAlertReviewed] = useState(false);
  const S = { persona, setPersona, quizDone, setQuizDone, quizIdx, setQuizIdx, answers, setAnswers, result, setResult,
    zatcaDone, setZatcaDone, launchSteps, setLaunchSteps, launchStep, setLaunchStep, referrals, setReferrals,
    invoices, setInvoices, quotes, setQuotes, applied, setApplied, vatFiled, setVatFiled,
    crm, setCrm, orders, setOrders, imported, setImported, alertReviewed, setAlertReviewed,
    waitlist, setWaitlist, tier, setTier, profileRow, setProfileRow };

  // ---- uniform canvas scaling ----
  const CW = 460, CH = 960, BORDER = 12;
  const [fit, setFit] = React.useState({ s: 1, h: CH, mobile: false });
  React.useEffect(() => {
    const calc = () => {
      const vw = window.innerWidth, vh = window.innerHeight;
      if (vw <= 640) {
        const s = vw / CW;
        setFit({ s, h: Math.round(vh / s), mobile: true });
      } else {
        const s = Math.min(1, (vh - 150) / (CH + BORDER * 2), (vw - 28) / (CW + BORDER * 2));
        setFit({ s, h: CH, mobile: false });
      }
    };
    calc();
    window.addEventListener("resize", calc);
    return () => window.removeEventListener("resize", calc);
  }, []);

  const tabForScreen = {
    journey: "journey", ideate: "journey", mapper: "journey", quiz: "journey", scoreReveal: "journey", grow: "journey", pricing: "journey",
    launch: "launch", walkthrough: "launch", market: "launch", connect: "launch",
    operate: "operate", invoice: "operate", invoiceSuccess: "operate", customers: "operate", orders: "operate", schedule: "operate", team: "operate", compliance: "operate",
    profile: "profile", profileDetail: "profile",
  };
  const backMap = {
    ideate: "journey", mapper: "ideate", quiz: "journey", grow: "journey", pricing: "journey",
    walkthrough: "launch", market: "launch", connect: "launch",
    invoice: "operate", customers: "operate", orders: "operate", schedule: "operate", team: "operate", compliance: "operate",
    profileDetail: "profile",
  };
  const go = (s) => setScreen(s);
  const tab = tabForScreen[screen] || "journey";
  const hdr = {
    journey: null, ideate: t.ideateHdr, mapper: t.mapperHdr, quiz: t.quizHdr, scoreReveal: t.quizHdr,
    launch: t.launchHdr, walkthrough: (S.launchStep != null ? t.steps[S.launchStep].portal : t.launchHdr), market: t.openMarket, connect: t.connectHdr,
    operate: t.opHdr, invoice: t.invHdr, invoiceSuccess: t.invOkHdr,
    customers: t.custHdr, orders: t.ordersHdr, schedule: t.schedHdr, team: t.teamHdr, compliance: t.compHdr,
    grow: t.growHdr, pricing: t.prHdr,
    profile: t.tabs.profile, profileDetail: t.profRows[profileRow],
  };
  const showBack = Object.keys(backMap).includes(screen);

  const body = () => {
    switch (screen) {
      case "journey": return <Journey t={t} lang={lang} go={go} S={S} />;
      case "quiz": return <Quiz t={t} lang={lang} go={go} S={S} />;
      case "scoreReveal": return <ScoreReveal t={t} lang={lang} go={go} S={S} />;
      case "ideate": return <Ideate t={t} lang={lang} go={go} S={S} />;
      case "mapper": return <Mapper t={t} />;
      case "launch": return <Launch t={t} lang={lang} go={go} S={S} />;
      case "walkthrough": return <Walkthrough t={t} lang={lang} go={go} S={S} />;
      case "market": return <Market t={t} S={S} />;
      case "connect": return <Connect t={t} S={S} />;
      case "operate": return <Operate t={t} lang={lang} go={go} S={S} />;
      case "invoice": return <Invoice t={t} go={go} S={S} />;
      case "invoiceSuccess": return <InvoiceSuccess t={t} go={go} />;
      case "customers": return <Customers t={t} lang={lang} go={go} S={S} />;
      case "orders": return <Orders t={t} lang={lang} go={go} S={S} />;
      case "schedule": return <Schedule t={t} S={S} />;
      case "team": return <Team t={t} />;
      case "compliance": return <Compliance t={t} S={S} />;
      case "grow": return <Grow t={t} S={S} />;
      case "pricing": return <Pricing t={t} S={S} />;
      case "profile": return <Profile t={t} lang={lang} go={go} S={S} />;
      case "profileDetail": return <ProfileDetail t={t} S={S} />;
      default: return null;
    }
  };

  return (
    <div className="intilaqa-stage" style={{ background: "#E8ECE6" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap');
        .intilaqa-stage{
          min-height:100vh; min-height:100dvh;
          display:flex; flex-direction:column; align-items:center;
          padding:20px 14px; gap:12px;
        }
        .intilaqa-phone{
          border-radius:56px; border:12px solid #12201B;
          overflow:hidden;
        }
        .intilaqa-phone *::-webkit-scrollbar{ width:0px; height:0px; }
        .intilaqa-phone *{ scrollbar-width:none; -ms-overflow-style:none; }
        @media (max-width:640px){
          .intilaqa-stage{ padding:0; gap:0; background:#12201B; }
          .intilaqa-phone{ border-radius:0; border:0; }
        }
      `}</style>

      <Phone dir={t.dir} dark={screen === "login" || screen === "splash"} w={CW} h={fit.h} s={fit.s} mobile={fit.mobile}>
        <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
          {screen === "splash"
            ? <Splash t={t} lang={lang} setLang={setLang} go={go} idx={splashIdx} setIdx={setSplashIdx} />
            : screen === "login"
            ? <Login t={t} lang={lang} setLang={setLang} go={go} S={S} />
            : (
              <>
                <Header t={t} lang={lang} setLang={setLang} title={hdr[screen] ?? ""} onBack={showBack ? () => go(backMap[screen] || "journey") : null} />
                <Scroll>{body()}</Scroll>
                <TabBar t={t} tab={tab} go={go} />
              </>
            )}
        </div>
      </Phone>
    </div>
  );
}


  const le=document.getElementById("loading"); if(le) le.style.display="none";
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch(e){ window.__err(e && e.stack ? e.stack : String(e)); }
</script>
<script>
  setTimeout(function(){var r=document.getElementById('root');if(r&&r.children.length===0){var l=document.getElementById('loading');if(l&&l.style.display!=='none')window.__err('Scripts did not finish loading (CDN may be blocked).');}},6000);
</script>
</body>
</html>
