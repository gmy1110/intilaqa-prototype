function Phone({ children, dir }) {
  return (
    <div style={{
      width: 390, minHeight: 800, background: C.paper, borderRadius: 44,
      border: `10px solid ${C.ink}`, boxShadow: "0 30px 70px rgba(8,40,28,.28)",
      overflow: "hidden", position: "relative", direction: dir,
      fontFamily: dir === "rtl" ? "'Noto Kufi Arabic', system-ui, sans-serif" : "'Poppins','Segoe UI',system-ui,sans-serif",
    }}>
      <div style={{ position: "absolute", top: 0, left: "50%", transform: "translateX(-50%)", width: 150, height: 26, background: C.ink, borderRadius: "0 0 18px 18px", zIndex: 30 }} />
      <div style={{ height: 800, overflowY: "auto" }}>{children}</div>
    </div>
  );
}

function Mark({ size = 30 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="19" fill={C.green} />
      <path d="M11 29 C 16 29, 18 15, 29 11" stroke={C.goldLt} strokeWidth="2.4" strokeLinecap="round" fill="none" opacity="0.6" />
      <path d="M29 11 l-1.5 6 l6 -1.5 z" fill={C.gold} />
      <circle cx="11" cy="29" r="2.6" fill={C.gold} />
    </svg>
  );
}

function TopBar({ t, lang, setLang, onBack }) {
  return (
    <div style={{ padding: "34px 18px 12px", display: "flex", alignItems: "center", gap: 10 }}>
      {onBack ? (
        <button onClick={onBack} style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, width: 38, height: 38, cursor: "pointer", color: C.ink, fontSize: 16 }}>
          {t.dir === "rtl" ? "→" : "←"}
        </button>
      ) : <Mark />}
      <div style={{ flex: 1 }}>
        <div style={{ fontWeight: 700, fontSize: 17, color: C.ink, letterSpacing: t.dir === "rtl" ? 0 : ".5px" }}>
          {lang === "ar" ? "إنطلاقة" : "Intilaqa"}
        </div>
      </div>
      <button onClick={() => setLang(lang === "en" ? "ar" : "en")}
        style={{ background: C.greenLt, border: `1px solid ${C.green}`, color: C.green, borderRadius: 20, padding: "7px 13px", fontSize: 12.5, fontWeight: 700, cursor: "pointer" }}>
        {lang === "en" ? "عربي" : "EN"}
      </button>
    </div>
  );
}

const Primary = ({ children, onClick, tone = "green" }) => (
  <button onClick={onClick} style={{ width: "100%", background: tone === "gold" ? C.gold : C.green, color: tone === "gold" ? C.ink : "#fff", border: "none", borderRadius: 16, padding: 15, fontSize: 15, fontWeight: 700, cursor: "pointer", marginTop: 8 }}>{children}</button>
);

          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700, color: C.ink, fontSize: 15.5 }}>{p.role}</div>
            <div style={{ color: C.mute, fontSize: 12.5, marginTop: 2 }}>{p.detail}</div>
          </div>
          <span style={{ fontSize: 11, fontWeight: 700, color: C.green, background: C.greenLt, padding: "4px 9px", borderRadius: 8 }}>{p.stage}</span>
        </button>
      ))}
      <div style={{ marginTop: 18, padding: 15, background: C.greenDk, borderRadius: 16, color: "#DCEDE5", fontSize: 13, lineHeight: 1.5, textAlign: "center" }}>{t.promise}</div>
    </div>
  );
}

function Journey({ t, go }) {
  const dot = (active, done) => active ? C.gold : done ? C.green : C.line;
  return (
    <div style={{ padding: "0 0 30px" }}>
      <div style={{ padding: "4px 20px 18px" }}>
        <H1>{t.journeyTitle}</H1><Sub>{t.journeySub}</Sub>
      </div>
      <div style={{ position: "relative", padding: "0 20px" }}>
        <div style={{ position: "absolute", [t.dir === "rtl" ? "right" : "left"]: 46, top: 12, bottom: 40, width: 3, background: `linear-gradient(${C.green}, ${C.gold})`, borderRadius: 2, opacity: .5 }} />
        {t.stages.map((s, i) => {
          const active = i === 1; const done = i === 0;
          return (
            <div key={s.key} style={{ display: "flex", gap: 14, marginBottom: 14, position: "relative" }}>
              <div style={{ width: 54, display: "flex", justifyContent: "center", flexShrink: 0, paddingTop: 20 }}>
                <div style={{ width: 18, height: 18, borderRadius: "50%", background: dot(active, done), border: `4px solid ${C.paper}`, boxShadow: active ? `0 0 0 4px ${C.goldLt}` : "none", zIndex: 2 }} />
              </div>
              <button onClick={() => s.go && go(s.go)}
                style={{ flex: 1, textAlign: t.dir === "rtl" ? "right" : "left", background: C.card, border: `1px solid ${active ? C.gold : C.line}`, borderRadius: 18, padding: 15, cursor: s.go ? "pointer" : "default", boxShadow: active ? "0 8px 22px rgba(224,165,38,.18)" : "none" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 5 }}>
                  <span style={{ fontWeight: 700, color: C.ink, fontSize: 16 }}>{s.label}</span>
                  <span style={{ fontSize: 11.5, fontWeight: 700, color: active ? C.gold : C.green, background: active ? C.goldLt : C.greenLt, padding: "3px 9px", borderRadius: 8 }}>{s.price}</span>
                </div>
                <div style={{ color: C.mute, fontSize: 13, marginBottom: 10, lineHeight: 1.4 }}>{s.blurb}</div>
                {s.go && <div style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 13, fontWeight: 700, color: active ? C.gold : C.green }}>{s.cta} <span>{t.dir === "rtl" ? "←" : "→"}</span></div>}
              </button>
            </div>
          );
        })}
      </div>
      <div style={{ padding: "6px 20px 0" }}><Primary onClick={() => go("pricing")}>{t.seePricing}</Primary></div>
    </div>
  );
}

function Ideate({ t, go }) {
  return (
    <div style={{ padding: "0 20px 30px" }}>
      <H1>{t.ideateTitle}</H1><Sub>{t.ideateSub}</Sub>
      {t.ideateSteps.map((s, i) => (
        <div key={i} style={{ display: "flex", gap: 12, alignItems: "center", background: C.card, border: `1px solid ${s.active ? C.gold : C.line}`, borderRadius: 16, padding: 14, marginBottom: 10 }}>
          <div style={{ width: 30, height: 30, borderRadius: 9, flexShrink: 0, display: "grid", placeItems: "center", fontWeight: 700, fontSize: 13, background: s.done ? C.green : s.active ? C.gold : C.greenLt, color: s.done || s.active ? "#fff" : C.green }}>{s.done ? "✓" : i + 1}</div>
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700, color: C.ink, fontSize: 14 }}>{s.label}</div>
            <div style={{ color: C.mute, fontSize: 12.5, marginTop: 1 }}>{s.q}</div>
          </div>
        </div>
      ))}
      <Primary onClick={() => go("score")}>{t.dir === "rtl" ? "احسب الدرجة" : "Calculate score"}</Primary>
    </div>
  );
}

function Score({ t, go }) {
  const val = 74; const r = 66; const circ = 2 * Math.PI * r;
  return (
    <div style={{ padding: "0 20px 30px" }}>
      <H1>{t.scoreTitle}</H1>
      <div style={{ display: "grid", placeItems: "center", margin: "18px 0 8px" }}>
        <svg width="180" height="180" viewBox="0 0 160 160">
          <circle cx="80" cy="80" r={r} fill="none" stroke={C.greenLt} strokeWidth="14" />
          <circle cx="80" cy="80" r={r} fill="none" stroke={C.gold} strokeWidth="14" strokeLinecap="round"
            strokeDasharray={circ} strokeDashoffset={circ * (1 - val / 100)} transform="rotate(-90 80 80)" />
          <text x="80" y="76" textAnchor="middle" fontSize="42" fontWeight="700" fill={C.ink}>{val}</text>
          <text x="80" y="100" textAnchor="middle" fontSize="13" fill={C.mute}>/ 100</text>
        </svg>
      </div>
      <div style={{ textAlign: "center", fontWeight: 700, color: C.green, fontSize: 16, marginBottom: 4 }}>{t.scoreVerdict}</div>
      <div style={{ textAlign: "center", color: C.mute, fontSize: 13, marginBottom: 16 }}>{t.scoreNote}</div>
      <Primary tone="gold" onClick={() => go("navigator")}>{t.unlockLaunch}</Primary>
      <Ghost onClick={() => go("mapper")}>{t.seeMapper}</Ghost>
    </div>
  );
}

function Mapper({ t }) {
  const fitColor = (f) => (f === "High" || f === "عالي") ? C.green : C.gold;
  return (
    <div style={{ padding: "0 20px 30px" }}>
      <H1>{t.mapperTitle}</H1><Sub>{t.mapperSub}</Sub>
      <div style={{ background: C.greenDk, borderRadius: 14, padding: 13, color: "#DCEDE5", fontSize: 13, marginBottom: 16, fontWeight: 600 }}>{t.mapperIdea}</div>
      {t.matches.map((m, i) => (
        <div key={i} style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 16, padding: 14, marginBottom: 10 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
            <div style={{ fontWeight: 700, color: C.ink, fontSize: 14.5, flex: 1 }}>{m.prog}</div>
            <span style={{ fontSize: 11, fontWeight: 700, color: fitColor(m.fit), background: fitColor(m.fit) === C.green ? C.greenLt : C.goldLt, padding: "3px 9px", borderRadius: 8, whiteSpace: "nowrap" }}>{t.fitLabel}: {m.fit}</span>
          </div>
          <div style={{ color: C.mute, fontSize: 12.5, margin: "6px 0" }}>{m.note}</div>
          <span style={{ fontSize: 11.5, color: C.green, background: C.greenLt, padding: "3px 9px", borderRadius: 8 }}>{m.sector}</span>
        </div>
      ))}
    </div>
  );
}

function Navigator({ t, go }) {
  const doneCount = t.navSteps.filter(s => s.done).length;
  const pct = Math.round((doneCount / t.navSteps.length) * 100);
  return (
    <div style={{ padding: "0 20px 30px" }}>
      <H1>{t.navTitle}</H1><Sub>{t.navSub}</Sub>
      <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 16, padding: 14, marginBottom: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 8 }}>
          <span style={{ color: C.ink, fontWeight: 700 }}>{doneCount} / {t.navSteps.length}</span>
          <span style={{ color: C.green, fontWeight: 700 }}>{pct}%</span>
        </div>
        <div style={{ height: 8, background: C.greenLt, borderRadius: 6, overflow: "hidden" }}>
          <div style={{ width: `${pct}%`, height: "100%", background: `linear-gradient(90deg, ${C.green}, ${C.gold})` }} />
        </div>
      </div>
      {t.navSteps.map((s, i) => {
        const state = s.done ? "done" : s.active ? "now" : "next";
        return (
          <div key={i} style={{ display: "flex", gap: 12, background: C.card, border: `1px solid ${s.active ? C.gold : C.line}`, borderRadius: 16, padding: 14, marginBottom: 10, alignItems: "center", boxShadow: s.active ? "0 6px 18px rgba(224,165,38,.15)" : "none" }}>
            <div style={{ width: 34, height: 34, borderRadius: 10, flexShrink: 0, display: "grid", placeItems: "center", fontWeight: 700, fontSize: 13, background: s.done ? C.green : s.active ? C.gold : C.greenLt, color: s.done || s.active ? "#fff" : C.green }}>{s.done ? "✓" : i + 1}</div>
            <div style={{ flex: 1 }}>
              <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                <span style={{ fontWeight: 700, color: C.ink, fontSize: 14.5 }}>{s.portal}</span>
                <span style={{ fontSize: 11, color: C.mute }}>· {s.time}</span>
              </div>
              <div style={{ color: C.mute, fontSize: 12.5, marginTop: 2 }}>{s.task}</div>
            </div>
            <span style={{ fontSize: 10.5, fontWeight: 700, padding: "4px 8px", borderRadius: 7, color: state === "done" ? C.green : state === "now" ? C.gold : C.mute, background: state === "done" ? C.greenLt : state === "now" ? C.goldLt : "#EEF2F0" }}>
              {state === "done" ? t.stepDone : state === "now" ? t.stepNow : t.stepNext}
            </span>
          </div>
        );
      })}
      {/* lawyer prompt */}
      <div style={{ background: C.card, border: `1px dashed ${C.green}`, borderRadius: 16, padding: 14, marginTop: 4, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
        <span style={{ fontSize: 13, fontWeight: 600, color: C.ink }}>{t.needLawyer}</span>
        <button onClick={() => go("market")} style={{ background: C.greenLt, color: C.green, border: "none", borderRadius: 10, padding: "8px 12px", fontSize: 12.5, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap" }}>{t.openMarket}</button>
      </div>
      <Ghost onClick={() => go("connect")}>{t.seeConnect}</Ghost>
      <Primary onClick={() => go("connect")}>{t.continue}</Primary>
    </div>
  );
}

function Market({ t }) {
  return (
    <div style={{ padding: "0 20px 30px" }}>
      <H1>{t.marketTitle}</H1><Sub>{t.marketSub}</Sub>
      {t.partners.map((p, i) => (
        <div key={i} style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 16, padding: 15, marginBottom: 12 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ fontWeight: 700, color: C.ink, fontSize: 15 }}>{p.name}</div>
              <div style={{ color: C.mute, fontSize: 12.5, marginTop: 1 }}>{p.type}</div>
            </div>
            <span style={{ fontSize: 10.5, fontWeight: 700, color: C.green, background: C.greenLt, padding: "4px 9px", borderRadius: 8 }}>✓ {p.rating}</span>
          </div>
          <div style={{ display: "flex", gap: 8, margin: "11px 0", flexWrap: "wrap" }}>
            <span style={{ fontSize: 11.5, color: C.ink, background: C.paper, border: `1px solid ${C.line}`, padding: "4px 9px", borderRadius: 8 }}>{t.slaLabel}: {p.sla}</span>
            <span style={{ fontSize: 11.5, color: C.gold, background: C.goldLt, padding: "4px 9px", borderRadius: 8, fontWeight: 700 }}>{p.price}</span>
          </div>
          <button style={{ width: "100%", background: C.greenLt, color: C.green, border: "none", borderRadius: 11, padding: 11, fontSize: 13.5, fontWeight: 700, cursor: "pointer" }}>{t.engage}</button>
        </div>
      ))}
    </div>
  );
}

function Connect({ t }) {
  return (
    <div style={{ padding: "0 20px 30px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 6 }}>
        <span style={{ color: C.gold, fontSize: 18 }}>◆</span><H1>{t.connectTitle}</H1>
      </div>
      <Sub>{t.connectSub}</Sub>
      {t.connectMatches.map((m, i) => (
        <div key={i} style={{ background: m.tag === "gold" ? C.greenDk : C.card, border: `1px solid ${m.tag === "gold" ? C.greenDk : C.line}`, borderRadius: 18, padding: 15, marginBottom: 12 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
            <div style={{ fontWeight: 700, color: m.tag === "gold" ? "#fff" : C.ink, fontSize: 14.5, flex: 1 }}>{m.name}</div>
            <span style={{ fontSize: 10.5, fontWeight: 700, color: C.green, background: C.greenLt, padding: "3px 8px", borderRadius: 7, whiteSpace: "nowrap" }}>{m.type}</span>
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", margin: "12px 0 12px" }}>
            <div>
              <div style={{ fontSize: 10.5, color: m.tag === "gold" ? "#9FC3B4" : C.mute }}>{t.closesIn}</div>
              <div style={{ fontSize: 15, fontWeight: 700, color: m.tag === "gold" ? C.gold : C.ink }}>{m.deadline}</div>
            </div>
            <div style={{ textAlign: t.dir === "rtl" ? "left" : "right" }}>
              <div style={{ fontSize: 10.5, color: m.tag === "gold" ? "#9FC3B4" : C.mute }}>{t.checklist}</div>
              <div style={{ fontSize: 12.5, fontWeight: 700, color: m.tag === "gold" ? "#DCEDE5" : C.mute }}>{m.ready}</div>
            </div>
          </div>
          <button style={{ width: "100%", background: m.tag === "gold" ? C.gold : C.greenLt, color: m.tag === "gold" ? C.ink : C.green, border: "none", borderRadius: 11, padding: 11, fontSize: 13.5, fontWeight: 700, cursor: "pointer" }}>{t.apply}</button>
        </div>
      ))}
    </div>
  );
}

function Operate({ t, go }) {
  return (
    <div style={{ padding: "0 20px 30px" }}>
      <H1>{t.operateTitle}</H1><Sub>{t.operateSub}</Sub>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        {t.tiles.map((tile, i) => (
          <button key={i} onClick={() => tile.go && go(tile.go)} style={{ textAlign: t.dir === "rtl" ? "right" : "left", background: C.card, border: `1px solid ${tile.go ? C.gold : C.line}`, borderRadius: 16, padding: 15, cursor: tile.go ? "pointer" : "default" }}>
            <div style={{ width: 30, height: 30, borderRadius: 9, background: tile.go ? C.goldLt : C.greenLt, marginBottom: 10, display: "grid", placeItems: "center", color: tile.go ? C.gold : C.green, fontWeight: 700 }}>●</div>
            <div style={{ fontWeight: 700, color: C.ink, fontSize: 14.5 }}>{tile.t}</div>
            <div style={{ color: C.mute, fontSize: 11.5, margin: "1px 0 8px" }}>{tile.s}</div>
            <div style={{ fontSize: 13, fontWeight: 700, color: C.green }}>{tile.v}</div>
          </button>
        ))}
      </div>
      <Primary tone="gold" onClick={() => go("invoice")}>+ {t.newInvoice}</Primary>
    </div>
  );
}

function Invoice({ t }) {
  return (
    <div style={{ padding: "0 20px 30px" }}>
      <H1>{t.invTitle}</H1><Sub>{t.invSub}</Sub>
      <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 18, padding: 16 }}>
        {t.invFields.map((f, i) => (
          <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "11px 0", borderBottom: `1px solid ${C.line}` }}>
            <span style={{ color: C.mute, fontSize: 13 }}>{f.k}</span>
            <span style={{ color: C.ink, fontSize: 13.5, fontWeight: 600 }}>{f.v}</span>
          </div>
        ))}
        <div style={{ display: "flex", justifyContent: "space-between", paddingTop: 14 }}>
          <span style={{ color: C.ink, fontSize: 15, fontWeight: 700 }}>{t.invTotal}</span>
          <span style={{ color: C.green, fontSize: 18, fontWeight: 700 }}>{t.invTotalV}</span>
        </div>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 10, background: C.greenLt, borderRadius: 14, padding: 13, marginTop: 12 }}>
        <div style={{ width: 42, height: 42, borderRadius: 8, background: "#fff", border: `1px solid ${C.green}`, display: "grid", placeItems: "center", flexShrink: 0 }}>
          {/* mini QR */}
          <svg width="26" height="26" viewBox="0 0 26 26">
            {[...Array(36)].map((_, i) => { const x = i % 6, y = Math.floor(i / 6); return (x + y) % 2 === 0 || i % 3 === 0 ? <rect key={i} x={x * 4 + 1} y={y * 4 + 1} width="3.4" height="3.4" fill={C.ink} /> : null; })}
          </svg>
        </div>
        <span style={{ fontSize: 12.5, color: C.green, fontWeight: 600, lineHeight: 1.4 }}>{t.invCompliant}</span>
      </div>
      <Primary onClick={() => {}}>{t.issue}</Primary>
    </div>
  );
}

function Pricing({ t }) {
  return (
    <div style={{ padding: "0 18px 30px" }}>
      <h1 style={{ fontSize: 21, color: C.ink, margin: "6px 0 4px", fontWeight: 700, lineHeight: 1.25 }}>{t.pricingTitle}</h1>
      <Sub>{t.pricingSub}</Sub>
      {t.tiers.map((tier, i) => (
        <div key={i} style={{ background: tier.hi ? C.greenDk : C.card, border: `1px solid ${tier.hi ? C.greenDk : C.line}`, borderRadius: 18, padding: 17, marginBottom: 12, position: "relative", boxShadow: tier.hi ? "0 12px 28px rgba(11,110,79,.25)" : "none" }}>
          {tier.hi && <span style={{ position: "absolute", top: -9, [t.dir === "rtl" ? "right" : "left"]: 17, background: C.gold, color: C.ink, fontSize: 10.5, fontWeight: 700, padding: "3px 10px", borderRadius: 8 }}>{t.popular}</span>}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
            <span style={{ fontWeight: 700, fontSize: 17, color: tier.hi ? "#fff" : C.ink }}>{tier.name}</span>
            <div style={{ textAlign: t.dir === "rtl" ? "left" : "right" }}>
              <span style={{ fontSize: 22, fontWeight: 700, color: tier.hi ? C.gold : C.green }}>{tier.price}</span>
              <div style={{ fontSize: 10.5, color: tier.hi ? "#9FC3B4" : C.mute }}>{tier.per}</div>
            </div>
          </div>
          <div style={{ fontSize: 12.5, color: tier.hi ? "#DCEDE5" : C.mute, margin: "3px 0 11px" }}>{tier.blurb}</div>
          {tier.feats.map((f, j) => (
            <div key={j} style={{ display: "flex", gap: 8, alignItems: "center", fontSize: 12.5, color: tier.hi ? "#EAF3EF" : C.ink, marginBottom: 6 }}>
              <span style={{ color: tier.hi ? C.gold : C.green, fontWeight: 700 }}>✓</span> {f}
            </div>
          ))}
          <button style={{ width: "100%", marginTop: 10, background: tier.hi ? C.gold : C.greenLt, color: tier.hi ? C.ink : C.green, border: "none", borderRadius: 12, padding: 12, fontSize: 14, fontWeight: 700, cursor: "pointer" }}>{tier.cta}</button>
        </div>
      ))}
    </div>
  );
}

function App() {
  const [lang, setLang] = useState("en");
  const [screen, setScreen] = useState("onboarding");
  const t = T[lang];

  const backMap = {
    journey: "onboarding", ideate: "journey", score: "ideate", mapper: "score",
    navigator: "journey", market: "navigator", connect: "navigator",
    operate: "journey", invoice: "operate", pricing: "journey",
  };
  const showBack = screen !== "onboarding";

  const navPills = [
    ["onboarding", lang === "ar" ? "البداية" : "Start"],
    ["journey", t.home],
    ["ideate", lang === "ar" ? "الفكرة" : "Ideate"],
    ["mapper", lang === "ar" ? "المُخطِّط" : "Mapper"],
    ["navigator", lang === "ar" ? "المرشد" : "Navigator"],
    ["market", lang === "ar" ? "السوق" : "Market"],
    ["connect", lang === "ar" ? "كونكت" : "Connect"],
    ["operate", lang === "ar" ? "التشغيل" : "Operate"],
    ["invoice", lang === "ar" ? "الفوترة" : "Invoice"],
    ["pricing", lang === "ar" ? "الأسعار" : "Pricing"],
  ];

  return (
    <div style={{ minHeight: "100vh", background: "#EEF1EC", display: "flex", flexDirection: "column", alignItems: "center", padding: "26px 14px", gap: 14 }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap');`}</style>
      <div style={{ textAlign: "center", maxWidth: 390 }}>
        <div style={{ fontSize: 12, color: C.mute, direction: t.dir }}>{t.tagline}</div>
      </div>
      <Phone dir={t.dir}>
        <TopBar t={t} lang={lang} setLang={setLang} onBack={showBack ? () => setScreen(backMap[screen]) : null} />
        {screen === "onboarding" && <Onboarding t={t} go={setScreen} />}
        {screen === "journey" && <Journey t={t} go={setScreen} />}
        {screen === "ideate" && <Ideate t={t} go={setScreen} />}
        {screen === "score" && <Score t={t} go={setScreen} />}
        {screen === "mapper" && <Mapper t={t} />}
        {screen === "navigator" && <Navigator t={t} go={setScreen} />}
        {screen === "market" && <Market t={t} />}
        {screen === "connect" && <Connect t={t} />}
        {screen === "operate" && <Operate t={t} go={setScreen} />}
        {screen === "invoice" && <Invoice t={t} />}
        {screen === "pricing" && <Pricing t={t} />}
      </Phone>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", justifyContent: "center", maxWidth: 430 }}>
        {navPills.map(([k, label]) => (
          <button key={k} onClick={() => setScreen(k)}
            style={{ background: screen === k ? C.green : "#fff", color: screen === k ? "#fff" : C.mute, border: `1px solid ${screen === k ? C.green : C.line}`, borderRadius: 20, padding: "7px 12px", fontSize: 11.5, fontWeight: 600, cursor: "pointer" }}>
            {label}
          </button>
        ))}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
